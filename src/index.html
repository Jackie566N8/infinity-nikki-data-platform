  <body>
    <a class="skip" href="#main">跳到图鉴</a>
    <aside class="sidebar">
      <a class="brand" href="#outfits"
        ><span class="brand-star">✧</span
        ><span>奇迹旅册<small>MIRALAND ARCHIVE</small></span></a
      >
      <div class="nav-label">搭配师的随身图鉴</div>
      <nav aria-label="主导航" id="navigation"></nav>
      <div class="sidebar-bottom">
        <div class="small-star">✦</div>
        <p>每一次相遇，<br />都值得好好收藏。</p>
        <button class="text-button" data-nav="sources">
          资料来源与收录说明 ↗</button
        ><span class="version">社区资料 · 非官方网站</span>
      </div>
    </aside>
    <div class="page">
      <header class="topbar">
        <button class="mobile-menu icon-button" aria-label="打开导航" id="menu">
          ☰
        </button>
        <div class="breadcrumb">
          奇迹大陆 <span>/</span> <b id="breadcrumb">套装图鉴</b>
        </div>
        <form class="global-search" role="search" id="global-form">
          <span aria-hidden="true">⌕</span
          ><input
            id="global-query"
            aria-label="全站搜索"
            placeholder="搜索套装、昵称、材料…"
            autocomplete="off"
          /><kbd>/</kbd>
        </form>
        <button
          type="button"
          id="momo-cursor-toggle"
          class="cursor-toggle"
          data-no-translate
          aria-label="大喵光标"
          aria-pressed="true"
          title="关闭大喵光标，使用系统光标"
        >
          <svg
            class="cursor-toggle-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <ellipse cx="6" cy="7" rx="2.4" ry="3" />
            <ellipse cx="12" cy="4.5" rx="2.4" ry="3" />
            <ellipse cx="18" cy="7" rx="2.4" ry="3" />
            <path d="M5 16c0-3 4-7 7-7s7 4 7 7c0 5-4 3-7 3s-7 2-7-3Z" /></svg
          ><span class="cursor-toggle-label">大喵光标</span
          ><span class="cursor-toggle-track" aria-hidden="true"></span></button
        ><button
          class="top-collection"
          data-nav="favorites"
          aria-label="打开我的收藏"
        >
          ♡ <span>我的收藏</span><b id="saved-count">0</b>
        </button>
      </header>
      <main id="main" tabindex="-1">
        <div id="view" aria-busy="true">
          <div class="module-loading" role="status">
            <span class="loading-star">✧</span>
            <p>图鉴资料载入中…</p>
          </div>
        </div>
      </main>
      <footer>
        <span>✧ 奇迹旅册</span>
        <p>与暖暖、大喵一起，记下奇迹大陆的每一份美好。</p>
        <button class="text-button" data-nav="sources">资料与版权说明</button>
      </footer>
    </div>
    <dialog id="detail" aria-labelledby="detail-title">
      <button id="close-detail" class="close-button" aria-label="关闭详情">
        ×
      </button>
      <div id="detail-content"></div>
    </dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <noscript>请开启 JavaScript，以搜索和浏览本地图鉴。</noscript>
  </body>
</html>
